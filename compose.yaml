services:
  db:
    image: postgres:16
    container_name: subledger_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-subledger}
      POSTGRES_USER: ${DB_USER:-subledger_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-subledger_password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-subledger_user} -d ${DB_NAME:-subledger}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: subledger_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
